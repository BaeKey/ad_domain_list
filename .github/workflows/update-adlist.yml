name: Update AdBlock List

on:
  schedule:
    # 每天 19:00 UTC（= 北京时间次日 03:00）
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Process Domain Lists (Multi-Source Voting)
        run: |
          python - <<'PYEOF'
          import requests
          import os
          import sys
          from collections import defaultdict

          # ================= 配置区域 =================
          SOURCES = {
              "anti-ad":   "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt",
              "hagezi":    "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi-onlydomains.txt",
              "1hosts":    "https://raw.githubusercontent.com/badmojr/1Hosts/refs/heads/master/Lite/domains.txt",
          }

          # OISD 的语义：example.com 表示拦截 example.com 及其所有子域名
          PARENT_MATCH_SOURCES = {"oisd"}

          VOTE_THRESHOLD = 3          # ≥ 3 票拦截（严格共识）

          LOCAL_WHITELIST_FILE = "whitelist.txt"
          LOCAL_BLACKLIST_FILE = "blacklist.txt"

          EXTERNAL_WHITELIST_URL = "https://raw.githubusercontent.com/privacy-protection-tools/dead-horse/master/anti-ad-white-list.txt"

          OUTPUT_FILE = "clean-list.txt"
          # ===========================================

          HEADERS = {
              "User-Agent": "Adblock-List-Builder/1.0 (GitHub Actions)"
          }

          def download_text(url, critical=True):
              try:
                  print(f"  Downloading: {url}")
                  r = requests.get(url, timeout=30, headers=HEADERS)
                  r.raise_for_status()
                  return r.text
              except Exception as e:
                  print(f"  ⚠ Error downloading {url}: {e}")
                  if critical:
                      sys.exit(1)
                  return ""

          def parse_lines(text):
              """解析纯文本：每行一个域名，# 开头为注释"""
              s = set()
              if not text:
                  return s
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  s.add(line)
              return s

          def parent_domains(domain):
              """生成 domain 的所有父级域名（从短到长），用于 OISD 匹配"""
              parts = domain.split(".")
              for i in range(1, len(parts)):
                  yield ".".join(parts[i:])

          def count_votes(domain, source_sets, parent_match_sources):
              """计算一个域名获得多少源的投票"""
              votes = 0
              for name, sset in source_sets:
                  if domain in sset:
                      votes += 1
                      continue
                  # 对于 OISD 等声明了"子域名通配"的源，检查父域名
                  if name in parent_match_sources:
                      for parent in parent_domains(domain):
                          if parent in sset:
                              votes += 1
                              break
              return votes

          def main():
              # ---------- 1. 下载所有源 ----------
              source_sets = []
              source_stats = {}
              for name, url in SOURCES.items():
                  print(f"\n[{name}]")
                  text = download_text(url)
                  s = parse_lines(text)
                  source_sets.append((name, s))
                  source_stats[name] = len(s)
                  print(f"  → {len(s)} domains")

              # ---------- 2. 投票筛选 ----------
              print("\n=== Voting ===")
              all_domains = set()
              for _, s in source_sets:
                  all_domains |= s
              print(f"Union of all sources: {len(all_domains)}")

              selected = set()
              for d in all_domains:
                  v = count_votes(d, source_sets, PARENT_MATCH_SOURCES)
                  if v >= VOTE_THRESHOLD:
                      selected.add(d)

              c_vote = len(selected)
              print(f"After voting (≥{VOTE_THRESHOLD} votes): {c_vote}")

              # ---- 各源在最终结果中的贡献统计 ----
              contributed = {}
              for name, sset in source_sets:
                  contributed[name] = len(selected & sset)
                  # OISD 额外：被父域名匹配带进来的（不在精确集合中，但子域名被投票通过）
                  if name in PARENT_MATCH_SOURCES:
                      oisd_parent_matched = selected - sset
                      # 这些域名不在 OISD 精确集合，但因其父域名在 OISD 中而被投票通过
                      parent_contributed = 0
                      for d in oisd_parent_matched:
                          for parent in parent_domains(d):
                              if parent in sset:
                                  parent_contributed += 1
                                  break
                      contributed[name + "_via_parent"] = parent_contributed

              # ---------- 3. 外部白名单（最优先移除） ----------
              ext_wl = parse_lines(download_text(EXTERNAL_WHITELIST_URL, critical=False))
              if ext_wl:
                  before = len(selected)
                  selected = {
                      d for d in selected
                      if not any(d == r or d.endswith("." + r) for r in ext_wl)
                  }
                  print(f"After External Whitelist: {len(selected)} (removed {before - len(selected)})")
              else:
                  print("External Whitelist: skipped (empty or failed download)")
              c_extwl = len(selected)

              # ---------- 4. 本地白名单 ----------
              if os.path.exists(LOCAL_WHITELIST_FILE):
                  local_wl = parse_lines(open(LOCAL_WHITELIST_FILE, encoding="utf-8").read())
                  if local_wl:
                      selected = {
                          d for d in selected
                          if not any(d == r or d.endswith("." + r) for r in local_wl)
                      }
              c_wl = len(selected)
              print(f"After Local Whitelist: {c_wl}")

              # ---------- 5. 本地黑名单（最高优先级） ----------
              if os.path.exists(LOCAL_BLACKLIST_FILE):
                  blacklist = parse_lines(open(LOCAL_BLACKLIST_FILE, encoding="utf-8").read())
                  selected |= blacklist
              c_final = len(selected)
              print(f"After Local Blacklist: {c_final}")

              # ---------- 6. 输出 ----------
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  for d in sorted(selected):
                      f.write(d + "\n")
              print(f"\n✅ Done. Written to {OUTPUT_FILE}: {c_final} domains")

              # ---------- 7. GitHub Step Summary ----------
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("### 🛡️ 广告过滤构建报告\n\n")

                      f.write("#### 📥 源数据量\n\n")
                      f.write("| 源 | 原始数量 |\n")
                      f.write("| :--- | ---: |\n")
                      for name in SOURCES:
                          f.write(f"| {name} | {source_stats[name]:,} |\n")
                      f.write("\n")

                      f.write("#### 🗳️ 投票结果（≥3 票）\n\n")
                      f.write("| 源 | 进入最终结果 | 贡献率 |\n")
                      f.write("| :--- | ---: | ---: |\n")
                      for name in SOURCES:
                          cnt = contributed.get(name, 0)
                          pct = f"{cnt / source_stats[name] * 100:.1f}%" if source_stats[name] else "-"
                          label = name
                          if name in PARENT_MATCH_SOURCES:
                              via = contributed.get(name + "_via_parent", 0)
                              label = name
                              f.write(f"| {label} | {cnt:,} (+{via:,} via parent) | {pct} |\n")
                          else:
                              f.write(f"| {label} | {cnt:,} | {pct} |\n")
                      f.write("\n")

                      f.write("#### 📊 处理流水线\n\n")
                      f.write("| 步骤 | 数量 |\n")
                      f.write("| :--- | ---: |\n")
                      f.write(f"| 并集（∪） | {len(all_domains):,} |\n")
                      f.write(f"| 投票 ≥{VOTE_THRESHOLD} | {c_vote:,} |\n")
                      f.write(f"| - 外部白名单 | {c_extwl:,} |\n")
                      f.write(f"| - 本地白名单 | {c_wl:,} |\n")
                      f.write(f"| + 本地黑名单 | {c_final:,} |\n")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clean-list.txt
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update adblock list" &&
            git push
          )
