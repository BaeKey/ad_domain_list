name: Update AdBlock List

on:
  schedule:
    # 每天 19:00 UTC（= 北京时间次日 03:00）
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Process Domain Lists
        run: |
          python - <<'EOF'
          import requests
          import os
          import sys

          # ================= 配置区域 =================
          AD_LIST_URL = "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt"
          HAGEZI_PRO_URL = "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/pro.txt"

          LOCAL_WHITELIST_FILE = "whitelist.txt"
          LOCAL_BLACKLIST_FILE = "blacklist.txt"

          OUTPUT_FILE = "clean-list.txt"
          # ===========================================

          HEADERS = {
              "User-Agent": "Adblock-List-Builder/1.0 (GitHub Actions)"
          }

          def download_text(url, critical=True):
              try:
                  print(f"Downloading: {url}")
                  r = requests.get(url, timeout=30, headers=HEADERS)
                  r.raise_for_status()
                  return r.text
              except Exception as e:
                  print(f"Error downloading {url}: {e}")
                  if critical:
                      sys.exit(1)
                  return ""

          def parse_lines(text):
              s = set()
              if not text:
                  return s
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  s.add(line)
              return s

          def main():
              # 1. Anti-AD
              ad_domains = parse_lines(download_text(AD_LIST_URL))
              c1 = len(ad_domains)
              print(f"Anti-AD loaded: {c1}")

              # 2. Intersection with Hagezi Light
              light_domains = parse_lines(download_text(HAGEZI_PRO_URL))
              ad_domains &= light_domains
              c2 = len(ad_domains)
              print(f"After Light intersection: {c2}")

              # 3. Local whitelist (Domain and its subdomains)
              if os.path.exists(LOCAL_WHITELIST_FILE):
                  local_wl = parse_lines(open(LOCAL_WHITELIST_FILE, encoding="utf-8").read())
                  if local_wl:
                      ad_domains = {
                          d for d in ad_domains
                          if not any(d == r or d.endswith("." + r) for r in local_wl)
                      }
              c3 = len(ad_domains)
              print(f"After Local Whitelist: {c3}")

              # 4. 🔥 Local blacklist (highest priority)
              if os.path.exists(LOCAL_BLACKLIST_FILE):
                  blacklist = parse_lines(open(LOCAL_BLACKLIST_FILE, encoding="utf-8").read())
                  ad_domains |= blacklist
              c4 = len(ad_domains)
              print(f"After Local Blacklist: {c4}")

              # Summary
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("### 🛡️ 广告过滤构建报告\n")
                      f.write("| 步骤 | 数量 |\n")
                      f.write("| :--- | ---: |\n")
                      f.write(f"| Anti-AD 初始 | {c1} |\n")
                      f.write(f"| ∩ Hagezi Light | {c2} |\n")
                      f.write(f"| - 本地白名单 | {c3} |\n")
                      f.write(f"| + 本地黑名单 | {c4} |\n")

              # Output
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  for d in sorted(ad_domains):
                      f.write(d + "\n")

              print(f"Done. Final count: {c4}")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add clean-list.txt
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update adblock list" &&
            git push
          )
